[project]
name = "sre-anomaly-root-cause"
version = "1.0.0"
description = "Day 23: Observability Analytics: Multivariate Anomaly Detection and Root Cause"
requires-python = ">=3.11"

[tool.ruff]
line-length = 150
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "B905", "E741", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:warnings"
