name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.find.outputs.days }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            days=$(ls -d day-*/ 2>/dev/null | tr -d '/' || true)
          else
            base="${{ github.event.before }}"
            [ "${{ github.event_name }}" = "pull_request" ] && base="${{ github.event.pull_request.base.sha }}"
            if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base=$(git rev-list --max-parents=0 HEAD); fi
            days=$(git diff --name-only "$base" HEAD | grep -oE '^day-[0-9]{2}-[^/]+' | sort -u || true)
          fi
          json=$(printf '%s\n' $days | jq -R . | jq -cs 'map(select(length>0))')
          echo "days=$json" >> "$GITHUB_OUTPUT"

  test:
    needs: changed
    if: needs.changed.outputs.days != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJson(needs.changed.outputs.days) }}
    defaults:
      run:
        working-directory: ${{ matrix.day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Test
        run: |
          if [ -f Makefile ] && grep -q '^test:' Makefile; then make test; else pytest -q; fi
