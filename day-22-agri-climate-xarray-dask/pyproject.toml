[project]
name = "agri-climate-xarray-dask"
version = "1.0.0"
description = "Day 22: Crop Yield and Climate Risk with xarray + Dask"
requires-python = ">=3.11"

[tool.ruff]
line-length = 150
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:warnings"
