[project]
name = "clickstream"
version = "1.0.0"
description = "Day 09: Clickstream Sessionisation at Scale with PySpark + Delta Lake (synthetic data)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:warnings"
