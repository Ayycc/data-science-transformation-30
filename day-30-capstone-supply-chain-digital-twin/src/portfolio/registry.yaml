# Curated facts for the portfolio retrospective. Everything here is checked by tests:
#  - every metric path must resolve in that day's committed results/metrics.json;
#  - every `evidence` string must appear verbatim in that day's README.md.
# Numbers are never typed here; they are read from metrics.json at report time.
#
# provenance.category:
#   synthetic_by_design     no public source attempted (the brief needs known ground truth)
#   synthetic_fallback      a public source was attempted, was unreachable, generator used
#   public_primary          headline results computed on public data
#   synthetic_plus_public   synthetic headline data plus a public dataset that was downloaded and used
# fmt: f3 (3 decimals), f4, pct (already in %), pct_frac (fraction shown as %), usd, usd_k (value in $k),
#      int, raw

