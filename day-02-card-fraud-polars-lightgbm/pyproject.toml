[project]
name = "card-fraud"
version = "1.0.0"
description = "Day 02: Card Fraud Detection at Speed with Polars + LightGBM (synthetic data)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:warnings"
