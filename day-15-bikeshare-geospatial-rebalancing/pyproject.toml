[project]
name = "bikeshare-geospatial-rebalancing"
version = "1.0.0"
description = "Day 15: Bike-Share Demand and Fleet Rebalancing"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:warnings"
