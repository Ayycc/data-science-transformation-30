- id: q47
  category: multi_metric
  question: New accounts and churned accounts by fiscal year
  expected: answer
  traps: [fiscal, churn, test]
  gold_sql: |
    WITH last_end AS (
      SELECT account_id, MAX(end_date) AS churn_date, BOOL_OR(end_date IS NULL) AS has_open
      FROM subscriptions GROUP BY account_id),
    churn AS (
      SELECT year(l.churn_date + INTERVAL 11 MONTH) AS fy, COUNT(*) AS churned FROM last_end l
      JOIN accounts a ON a.account_id = l.account_id WHERE NOT l.has_open AND NOT a.is_test GROUP BY 1),
    signups AS (
      SELECT year(signup_date + INTERVAL 11 MONTH) AS fy, COUNT(*) AS new_accts FROM accounts WHERE NOT is_test GROUP BY 1)
    SELECT COALESCE(s.fy, c.fy), s.new_accts, c.churned FROM signups s FULL OUTER JOIN churn c ON s.fy = c.fy
