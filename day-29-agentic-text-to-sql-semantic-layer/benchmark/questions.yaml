# 60-question benchmark for the SYNTHETIC SaaS warehouse.
# Gold SQL is hand-written against the RAW tables (not produced by the compiler) and is
# executed at benchmark time, so gold answers always match the generated data.
# Fiscal periods in gold SQL are computed arithmetically (FY = year(date + 11 months)),
# independently of dim_date, so the compiler's calendar join is tested too.
# expected: answer | refuse | clarify.  ordered: row order must match (ranking questions).
# traps: semantics a raw-schema guess gets wrong (fiscal, fx, churn, point_in_time, test, void).
questions:
# ---------------------------------------------------------------- simple totals
- id: q01
  category: simple
  question: What was total revenue in FY2025?
  expected: answer
  traps: [fiscal, fx, void, test]
  gold_sql: |
    SELECT SUM(i.amount_local * f.rate_to_usd) FROM invoices i
    JOIN accounts a ON a.account_id = i.account_id
    JOIN fx_rates f ON f.currency = i.currency AND f.month = CAST(date_trunc('month', i.invoice_date) AS DATE)
    WHERE i.status IN ('paid', 'open') AND a.is_test = FALSE AND year(i.invoice_date + INTERVAL 11 MONTH) = 2025
- id: q02
  category: simple
  question: How much revenue did we bill in fiscal year 2026?
