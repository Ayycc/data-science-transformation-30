- id: q05
  category: simple
  question: What is our current ARR?
  expected: answer
  traps: [point_in_time, fx, test]
  gold_sql: |
    SELECT SUM(s.mrr_local * 12 * f.rate_to_usd) FROM subscriptions s
    JOIN accounts a ON a.account_id = s.account_id
    JOIN fx_rates f ON f.currency = s.currency AND f.month = DATE '2026-01-01'
    WHERE NOT a.is_test AND s.start_date <= DATE '2026-01-31' AND (s.end_date IS NULL OR s.end_date > DATE '2026-01-31')
