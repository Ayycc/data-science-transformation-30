[project]
name = "agentic-text-to-sql-semantic-layer"
version = "1.0.0"
description = "Day 29: Agentic Analytics: Text-to-SQL over a Semantic Layer with Guardrails"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:warnings"
