# OPTIONAL artefact - not used by `make run` or tests.
# Start a local Marquez to browse the same OpenLineage events in a UI:
#   docker compose -f lineage/marquez/docker-compose.yml up -d
#   OPENLINEAGE_URL=http://localhost:5000 make run    # events are also POSTed to Marquez
#   open http://localhost:3000
services:
  marquez-db:
    image: postgres:14
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
  marquez:
    image: marquezproject/marquez:0.50.0
    depends_on: [marquez-db]
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports: ["5000:5000", "5001:5001"]
  marquez-web:
    image: marquezproject/marquez-web:0.50.0
    depends_on: [marquez]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    ports: ["3000:3000"]
