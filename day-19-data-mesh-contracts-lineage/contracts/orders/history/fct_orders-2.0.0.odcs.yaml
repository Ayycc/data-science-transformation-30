apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:orders:fct_orders
name: Orders
version: 2.0.0
status: active
domain: orders
dataProduct: orders
tenant: synthetic-shop
contractCreatedTs: '2026-08-19T00:00:00Z'
description:
  purpose: One row per customer order with its final status and value. Source of truth for order counts and GMV.
  usage: Join on order_id. Consumers must pin a major version (physicalName suffix _vN).
  limitations: SYNTHETIC data generated by a seeded simulator; not real customers or transactions.
team:
  name: orders-domain
  members:
  - username: orders-oncall
    role: owner
  - username: orders-steward
    role: steward
schema:
- name: fct_orders
  physicalName: fct_orders_v2
  physicalType: table
  properties:
  - name: order_id
    logicalType: string
    physicalType: varchar
    required: true
    unique: true
    primaryKey: true
    description: Order identifier (primary key).
  - name: customer_id
    logicalType: string
    physicalType: varchar
    required: true
    classification: pii
    description: Pseudonymous customer key.
  - name: order_ts
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: When the order was placed (UTC).
  - name: order_date
    logicalType: date
    physicalType: date
    required: true
    description: UTC calendar date of order_ts.
  - name: order_amount
    logicalType: number
    physicalType: decimal(12,2)
    required: true
    description: Order value before discounts, USD (renamed from order_total in 2.0.0).
  - name: currency
    logicalType: string
    physicalType: varchar
    required: true
    logicalTypeOptions:
      enum:
      - USD
    description: ISO 4217 currency code.
  - name: status
    logicalType: string
    physicalType: varchar
    required: true
    logicalTypeOptions:
      enum:
      - completed
      - cancelled
      - returned
    description: Final order status. 'returned' reported from 2026-08-19; v1 maps it to 'completed'.
  - name: sales_channel
    logicalType: string
    physicalType: varchar
    required: false
    logicalTypeOptions:
      enum:
      - web
      - app
      - marketplace
    description: Channel the order came from; null before 2026-07-22.
  - name: loaded_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: When the source file landed in the warehouse (freshness).
slaProperties:
- property: freshness
  value: 12
  unit: h
  element: fct_orders.loaded_at
- property: completeness
  value: 99.5
  unit: percent
- property: uniqueness
  value: 100
  unit: percent
  element: fct_orders.order_id
- property: volume
  value: 30000
  unit: rows
servers:
- server: warehouse
  type: duckdb
  database: orders
  schema: main
customProperties:
- property: dualPublish
  value:
  - version: 1.1.0
    physicalName: fct_orders_v1
    deprecationDate: '2026-10-31'
