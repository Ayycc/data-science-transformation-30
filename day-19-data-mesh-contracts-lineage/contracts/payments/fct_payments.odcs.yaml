apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:payments:fct_payments
name: Payments
version: 1.2.0
status: active
domain: payments
dataProduct: payments
tenant: synthetic-shop
contractCreatedTs: '2026-09-02T00:00:00Z'
description:
  purpose: One row per payment gateway event (capture, failure, refund). Source of truth for cash and net revenue. The raw
    feed moved to integer cents on 2026-08-05; the published amount stays in dollars.
  usage: Join on order_id. Consumers must pin a major version (physicalName suffix _vN).
  limitations: SYNTHETIC data generated by a seeded simulator; not real customers or transactions.
team:
  name: payments-domain
  members:
  - username: payments-oncall
    role: owner
schema:
- name: fct_payments
  physicalName: fct_payments_v1
  physicalType: table
  properties:
  - name: payment_id
    logicalType: string
    physicalType: varchar
    required: true
    unique: true
    primaryKey: true
    description: Payment event identifier (primary key).
  - name: order_id
    logicalType: string
    physicalType: varchar
    required: false
    description: Order the payment belongs to. Null for orphaned gateway events.
  - name: paid_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: Gateway event time (UTC).
  - name: amount
    logicalType: number
    physicalType: decimal(12,2)
    required: true
    description: Event amount in USD (always positive; sign is given by status).
  - name: currency
    logicalType: string
    physicalType: varchar
    required: true
    logicalTypeOptions:
      enum:
      - USD
    description: ISO 4217 currency code.
  - name: status
    logicalType: string
    physicalType: varchar
    required: true
    logicalTypeOptions:
      enum:
      - captured
      - failed
      - refunded
    description: Gateway outcome.
  - name: payment_method
    logicalType: string
    physicalType: varchar
    required: false
    logicalTypeOptions:
      enum:
      - card
      - wallet
      - bnpl
    description: Instrument used; null before 2026-08-05.
  - name: loaded_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: When the source file landed in the warehouse (freshness).
slaProperties:
- property: freshness
  value: 12
  unit: h
  element: fct_payments.loaded_at
- property: completeness
  value: 99.5
  unit: percent
- property: uniqueness
  value: 100
  unit: percent
  element: fct_payments.payment_id
- property: volume
  value: 30000
  unit: rows
servers:
- server: warehouse
  type: duckdb
  database: payments
  schema: main
