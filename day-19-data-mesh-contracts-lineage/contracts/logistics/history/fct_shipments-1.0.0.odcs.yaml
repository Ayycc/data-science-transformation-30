apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:logistics:fct_shipments
name: Shipments
version: 1.0.0
status: active
domain: logistics
dataProduct: logistics
tenant: synthetic-shop
contractCreatedTs: '2026-07-01T00:00:00Z'
description:
  purpose: One row per shipment with carrier, timestamps and on-time flag. Lands in 3-day batches.
  usage: Join on order_id. Consumers must pin a major version (physicalName suffix _vN).
  limitations: SYNTHETIC data generated by a seeded simulator; not real customers or transactions.
team:
  name: logistics-domain
  members:
  - username: logistics-oncall
    role: owner
schema:
- name: fct_shipments
  physicalName: fct_shipments_v1
  physicalType: table
  properties:
  - name: shipment_id
    logicalType: string
    physicalType: varchar
    required: true
    unique: true
    primaryKey: true
    description: Shipment identifier (primary key).
  - name: order_id
    logicalType: string
    physicalType: varchar
    required: true
    description: Order shipped.
  - name: carrier
    logicalType: string
    physicalType: varchar
    required: true
    logicalTypeOptions:
      enum:
      - UPS
      - FDX
      - DHL
      - USPS
    description: Carrier code.
  - name: shipped_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: Hand-over to carrier (UTC).
  - name: delivered_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: Proof of delivery (UTC).
  - name: promised_date
    logicalType: date
    physicalType: date
    required: true
    description: Delivery date promised to the customer.
  - name: is_on_time
    logicalType: boolean
    physicalType: boolean
    required: true
    description: delivered_at date <= promised_date.
  - name: loaded_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    description: When the source batch landed in the warehouse (freshness).
slaProperties:
- property: freshness
  value: 48
  unit: h
  element: fct_shipments.loaded_at
- property: completeness
  value: 99.5
  unit: percent
- property: uniqueness
  value: 100
  unit: percent
  element: fct_shipments.shipment_id
- property: volume
  value: 30000
  unit: rows
servers:
- server: warehouse
  type: duckdb
  database: logistics
  schema: main
