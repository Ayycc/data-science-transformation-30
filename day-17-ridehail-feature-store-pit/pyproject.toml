[project]
name = "ridehail-feature-store-pit"
version = "1.0.0"
description = "Day 17: Point-in-Time Correct Feature Store for Ride-Hailing ETA"
requires-python = ">=3.11"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:warnings"
